name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Unit and API tests use synthetic data and a stub model, so they run
      # without the dataset or trained artifacts. Integration tests skip.
      - name: Run tests
        env:
          GIT_PYTHON_REFRESH: quiet
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: pytest -q
